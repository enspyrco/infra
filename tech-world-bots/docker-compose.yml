# Tech World bots — all three run from the same image, differentiated by BOT_NAME.
# Migrated from Cloud Run to OCI for always-on (no cold starts).

services:
  clawd:
    build:
      context: ./src
    container_name: tw-clawd
    restart: unless-stopped
    environment:
      - BOT_NAME=clawd
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

  gremlin:
    build:
      context: ./src
    container_name: tw-gremlin
    restart: unless-stopped
    environment:
      - BOT_NAME=gremlin
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

