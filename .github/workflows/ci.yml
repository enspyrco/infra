name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    name: Shell Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: './scripts'
          additional_files: '.githooks/pre-commit'
          severity: warning

      # The deploy-bus fleet template (cd-bus/fleet/) ships its own shell
      # scripts; scandir above only covers ./scripts, so lint cd-bus/ too —
      # otherwise "Shell Linting" would be green while not covering them.
      - name: Run ShellCheck (cd-bus)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: './cd-bus'
          severity: warning

      # The avatar deploy/rollback substrate (avatar-deploy/bin/) lived only in
      # ~/bin on the production box until 2026-08-10 and was never linted. The
      # very first shellcheck run on it flagged SC2034 "IMG appears unused" —
      # which was a real, live defect: a trailing comment had swallowed
      # `echo "image=$IMG"`, silently dropping the image identity from every
      # lyra release record. scandir above covers neither ./cd-bus nor this, so
      # without its own step "Shell Linting" would be green while blind to the
      # scripts that can roll production back onto a vulnerable image.
      - name: Run ShellCheck (avatar-deploy)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: './avatar-deploy'
          severity: warning

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 150}}}" \
            .github/workflows/*.yml \
            */docker-compose.yml

  secret-quoting:
    name: Secret Quoting Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install mikefarah yq explicitly rather than relying on it being
      # preinstalled on the runner. REQUIRE_ALL=1 (below) already makes a
      # missing yq a HARD failure, so this prevents *spurious* CI failures if a
      # future ubuntu-latest image drops yq — it does not affect what the test
      # asserts (a missing yq could never pass silently). Pinned to a release
      # so the binary is deterministic. docker is still taken from the runner;
      # ubuntu-latest ships it, and REQUIRE_ALL=1 fails loudly if it ever stops.
      - name: Install yq (mikefarah)
        run: |
          YQ_VERSION=v4.44.3
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # REQUIRE_ALL=1 turns a missing tool into a hard failure rather than a
      # vacuous skip, so a future runner-image change that drops yq/docker
      # fails loudly instead of passing green with the checks silently skipped.
      - name: Run secret-quoting round-trip tests
        env:
          REQUIRE_ALL: "1"
        run: ./scripts/test-secret-quoting.sh

  restore-aiko-island:
    name: Aiko Island Restore Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real restore test: drives restore.sh's _restore_island_core + the
      # aiko_island_* discovery lib against throwaway docker volumes, asserting
      # the restored passkey rows land in the LIVE volume (content, not
      # presence) and that discovery never picks the orphaned ghost volume
      # (#1759). ubuntu-latest ships docker; REQUIRE_ALL=1 makes a missing
      # docker a HARD failure so this can't silently skip and go green.
      - name: Run aiko-island restore test
        env:
          REQUIRE_ALL: "1"
        run: ./scripts/test-restore-aiko-island.sh

  backup-libs:
    name: Backup Library Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hermetic unit tests for the backup helper libs — `docker` and `gh` are
      # stubbed, so no daemon, no token, no network, and nothing real is
      # mutated. These cover the fail-closed guards on container resolution,
      # where a wrong answer silently backs up the WRONG tenant's data (see
      # lib/resolve-container.sh) rather than failing visibly.
      # DISCOVERS tests; does not allowlist them. This block used to be one
      # hand-added step per test file, which means a new test did not run until
      # someone remembered to add it here — and a test that never runs is
      # indistinguishable from a test that passes. A peer session found exactly
      # this shape in a vitest config that allowlisted individual files and had
      # silently swallowed three new tests in one evening; the same audit here
      # found scripts/test-restore-xdeca.sh present in the repo and absent from
      # CI. Enumerating what exists removes the remembering step entirely.
      #
      # Fails if it finds NOTHING to run: a discovery loop that matches no files
      # is a green job that tested nothing, which is the failure this replaces.
      # PREREQUISITES FIRST. The discovery loop below runs every test, so anything
      # a test needs must be installed before it — not after, as this was on the
      # first attempt. Carnot caught it: discovery ran pg-dump-guard BEFORE the awk
      # dialects existed, and that test SKIPS SILENTLY when an alternate awk is
      # absent. A discovered run would have passed while skipping the coverage the
      # dedicated step was built to force — a true green about a different question,
      # introduced in the PR that exists to remove exactly that.
      - name: Install test prerequisites (gawk = the box's awk; mawk defensive)
        run: sudo apt-get install -y --no-install-recommends mawk gawk

      # Pinned mikefarah yq — the SAME install the secret-quoting job does, because
      # discovery runs that job's test too and REQUIRE_ALL=1 turns a wrong or absent
      # yq into a hard failure rather than a skip. There are two unrelated tools
      # called `yq` with incompatible syntax, so "the runner has a yq" is not the
      # same claim as "the runner has THIS yq"; the discovered run passed on
      # whatever the image happened to ship, which is luck, not a guarantee.
      #
      # I missed this on the first pass because I mapped prerequisites by grepping
      # for `apt-get install` and `REQUIRE_ALL` and never looked at `run:` blocks
      # that install by curl. The map had a blind spot exactly where the tool was.
      - name: Install yq (mikefarah) — same pin as the secret-quoting job
        run: |
          YQ_VERSION=v4.44.3
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # secret-quoting and restore-aiko-island run BOTH here and in their own
      # dedicated jobs above. That duplication is deliberate, not an oversight:
      # the dedicated jobs give branch protection a stable check NAME to require,
      # which a single discovery job cannot. Both surfaces now set REQUIRE_ALL=1
      # so the same test name means the same assertion in both places.
      - name: Run shell test suite (discovered, not listed)
        # REQUIRE_ALL=1 matches what the dedicated secret-quoting and
        # restore-aiko-island jobs set. Without it the same test name would mean a
        # weaker assertion surface here than there — two reservoirs at different
        # temperatures, where a missing prerequisite is enforced in one place and
        # treated as a skip in the other.
        env:
          REQUIRE_ALL: 1
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/test-*.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no scripts/test-*.sh found — discovery matched nothing, refusing to pass"
            exit 1
          fi
          echo "discovered ${#tests[@]} test scripts"
          failed=0
          skipped=0
          for t in "${tests[@]}"; do
            # A test may declare itself unrunnable in CI, IN THE TEST, with a
            # `# ci-skip: <reason>` line. The declaration lives at the point of
            # truth rather than in this workflow, so adding a test still needs no
            # edit here — and the skip is PRINTED, because a silent skip is the
            # same thing as the allowlist this replaces.
            # LINE 2 EXACTLY — immediately after the shebang. Matching `^# ci-skip:` anywhere in the
            # file is fail-open in the exact mechanism meant to stop silent
            # omissions: any occurrence in a heredoc, a doc block or a quoted
            # sample would remove that test from the run set, and CI would print
            # SKIP and move on. The likeliest victim is a future test OF this
            # mechanism, which would carry the marker as a fixture and skip
            # itself. Confining it to the header makes the declaration a
            # deliberate act at a fixed place rather than a string that can occur.
            #
            # "First few lines" was tried and is still too loose — a marker sitting
            # in prose on line 3 skipped the file in a local simulation. One exact
            # line is the only version with no judgement in it.
            reason=$(sed -n '2s/^# ci-skip:[[:space:]]*//p' "$t")
            if [ -n "$reason" ]; then
              echo "SKIP $t — $reason"
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed=1; fi
            echo "::endgroup::"
          done
          echo "ran $(( ${#tests[@]} - skipped )) / ${#tests[@]} discovered tests (${skipped} declared ci-skip)"
          exit "$failed"

  caddy-validate:
    name: Caddyfile Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate caddy/Caddyfile with the SAME image the box runs (caddy:2-alpine),
      # so a syntax error or bad directive is caught HERE — before a deploy reloads
      # it into the live proxy and takes every domain (*.imagineering.cc,
      # callonclare.com.au) down. `caddy validate` only parses + adapts the config;
      # it does NOT dial upstreams, so the localhost:PORT backends that don't exist
      # in CI are fine. Fails the build (non-zero) on an invalid Caddyfile.
      - name: Validate caddy/Caddyfile
        run: |
          docker run --rm -v "$PWD/caddy:/etc/caddy:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
