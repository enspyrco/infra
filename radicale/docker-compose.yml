services:
  radicale:
    # image built 2026-06-24; upstream publishes no version label (was :latest).
    # Multi-arch manifest list.
    # Digest confirmed served by Docker Hub 2026-08-31. This IS the live deploy
    # path, so if Hub ever GCs this untagged manifest a `deploy radicale` fails
    # closed (loud) rather than silently upgrading. Both this and the mautrix
    # bridges are now served pins — the bridges from our own GHCR mirror — so both
    # are restorable. The difference that remains: this one depends on Docker Hub's
    # retention, the bridges on ours. See matrix/DR-RESTORE.md.
    image: tomsquest/docker-radicale@sha256:65477ca10cec7434dbea25eb1847175d032a03b365748068b6ceaf5fab4e2c4e
    container_name: img-radicale
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - radicale_data:/data
      - ./config:/config:ro
    environment:
      - TAKE_FILE_OWNERSHIP=true

volumes:
  radicale_data:
