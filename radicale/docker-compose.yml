services:
  radicale:
    # image built 2026-06-24; upstream publishes no version label (was :latest).
    # Multi-arch manifest list.
    # Digest confirmed served by Docker Hub 2026-08-31. This IS the live deploy
    # path, so if Hub ever GCs this untagged manifest a `deploy radicale` fails
    # closed (loud) rather than silently upgrading. NOT the same class as the
    # mautrix bridges: this digest IS currently served, so the image stays
    # restorable from the registry and a fresh host can rebuild it. The bridges
    # are pinned to UNSERVED digests and cannot. Different failure, different fix.
    image: tomsquest/docker-radicale@sha256:65477ca10cec7434dbea25eb1847175d032a03b365748068b6ceaf5fab4e2c4e
    container_name: img-radicale
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - radicale_data:/data
      - ./config:/config:ro
    environment:
      - TAKE_FILE_OWNERSHIP=true

volumes:
  radicale_data:
