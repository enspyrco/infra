services:
  continuwuity:
    # v0.5.10-1 (was :latest); multi-arch manifest list
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:81ea00ad377999586e2a2c4d18c485fb6582bb37d7b345081f49e48b8f5d17d9
    restart: always
    ports:
      - "8008:6167"   # Client API
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      # Enables `!admin server backup-database` (RocksDB online checkpoint via
      # hardlinks of SST files). Lives in a separate volume from the live
      # database so the backup script can read it without touching the
      # running RocksDB tree. The nightly /opt/scripts/backup.sh reads from
      # the matrix_continuwuity_backups volume and prunes after tarring.
      CONTINUWUITY_DATABASE_BACKUP_PATH: /var/lib/continuwuity-backups
      CONTINUWUITY_PORT: "6167"
      CONTINUWUITY_ADDRESS: "0.0.0.0"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "true"
      CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      # Media is treated as disposable cache (NOT backed up — it's re-fetchable
      # federated/bridged content). Prune dangling media refs on startup so a
      # media-less DB restore boots clean instead of crashing the integrity check.
      CONTINUWUITY_PRUNE_MISSING_MEDIA: "true"
      CONTINUWUITY_LOG: "info"
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      - continuwuity_backups:/var/lib/continuwuity-backups
    ulimits:
      nofile:
        soft: 1048567
        hard: 1048567

  mautrix-telegram:
    # PINNED TO A DIGEST THE REGISTRY NO LONGER SERVES — deliberate, and it works.
    # dock.mau.dev has re-published :latest under a new index digest, so this
    # digest returns `no such manifest` from the registry (verified 2026-08-31).
    # Three mechanisms, each doing exactly one thing. Do not delete any of them
    # as ornament:
    #   the LOCAL LAYER  -> load-bearing. The running image carries this digest in
    #                       its RepoDigests, so `docker compose create` creates the
    #                       container from the image already in the local store.
    #                       The pin is only the NAME this is looked up by; the layer
    #                       is what keeps the service alive.
    #   pull_policy: never-> stops THIS service's pull from becoming a 404 at all
    #                       (reported Skipped). Load-bearing for every invocation
    #                       that is not deploy_matrix — a bare `docker compose pull`
    #                       on the box, or a future script that forgets the flag.
    #   --ignore-pull-failures (in deploy_matrix, scripts/deploy-to.sh)
    #                     -> keeps a SIBLING service's pull failure from aborting
    #                       the whole stack. It is not what saves this service.
    # None of the three can summon bytes the registry no longer has.
    # Two earlier versions of this comment were both wrong: "neither alone is
    # sufficient" overclaimed, and "the digest pin alone keeps the service running"
    # was its inverted twin. The layer is load-bearing; the pin names it.
    # Why this rather than :latest — :latest fails OPEN. deploy_matrix runs
    # `docker compose pull` on every deploy (scripts/deploy-to.sh), which would
    # move the service to a new image and `up -d` would recreate the bridge on it.
    # These bridges hold live linked-account session state, so an unplanned jump can
    # de-authenticate a link. (Each of these bridges holds its own live
    # session state — naming a fixed trio here was copy-paste imprecision.) This form instead records exactly what is running.
    # THE REAL TRADEOFF, stated honestly — this is NOT merely "fail closed":
    # it is FAIL-UNRECOVERABLE for this service once the local layer is gone.
    # The layer is NOT evicted by `docker image prune -a` alone — a running
    # container holds it. The real trigger is a teardown FIRST: `docker compose
    # down` and THEN `prune -a`, or a disk rebuild, or a `docker load` (which
    # strips RepoDigests). After any of those, nothing in this file can recreate
    # the container, even with the session volume intact — the one exception
    # being a `docker save` tarball taken BEFORE the layer died, which is why
    # that stopgap is worth having and is named in claude-tasks#3728. Before this pin, a rebuild would have pulled :latest
    # and produced a WORKING but different-version bridge. So this trades a
    # silent-version-jump risk for a cannot-rebuild risk; it is the better trade
    # for a routine deploy and the WORSE one for disaster recovery.
    # Pinning the currently-served index digest is NOT an escape: measured
    # 2026-08-31, it resolves to a DIFFERENT, newer image, not these bytes.
    # The only fix that is both immutable and recoverable is mirroring the running
    # images into our own GHCR and pinning there — claude-tasks#3728, which is
    # therefore a real DR gap and not a tidiness item.
    image: dock.mau.dev/mautrix/telegram@sha256:ddb42d9a943b390bea5a7e365b66b831c6749309e68048fae1e780abcb34aa03
    pull_policy: never
    restart: always
    volumes:
      - telegram_data:/data
    depends_on:
      - continuwuity

