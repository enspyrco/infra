services:
  continuwuity:
    # v0.5.10-1 (was :latest); multi-arch manifest list
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:81ea00ad377999586e2a2c4d18c485fb6582bb37d7b345081f49e48b8f5d17d9
    restart: always
    ports:
      - "8008:6167"   # Client API
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      # Enables `!admin server backup-database` (RocksDB online checkpoint via
      # hardlinks of SST files). Lives in a separate volume from the live
      # database so the backup script can read it without touching the
      # running RocksDB tree. The nightly /opt/scripts/backup.sh reads from
      # the matrix_continuwuity_backups volume and prunes after tarring.
      CONTINUWUITY_DATABASE_BACKUP_PATH: /var/lib/continuwuity-backups
      CONTINUWUITY_PORT: "6167"
      CONTINUWUITY_ADDRESS: "0.0.0.0"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "true"
      CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      # Media is treated as disposable cache (NOT backed up — it's re-fetchable
      # federated/bridged content). Prune dangling media refs on startup so a
      # media-less DB restore boots clean instead of crashing the integrity check.
      CONTINUWUITY_PRUNE_MISSING_MEDIA: "true"
      CONTINUWUITY_LOG: "info"
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      - continuwuity_backups:/var/lib/continuwuity-backups
    ulimits:
      nofile:
        soft: 1048567
        hard: 1048567

  mautrix-telegram:
    # PINNED TO A DIGEST THE REGISTRY NO LONGER SERVES — deliberate, and it works.
    # dock.mau.dev has re-published :latest under a new index digest, so this
    # digest returns `no such manifest` from the registry (verified 2026-08-31).
    # Two separate mechanisms, both verified on the box before shipping:
    #   pull_policy: never  -> `docker compose pull` reports Skipped, not 404.
    #                          (An unguarded control service in the same file
    #                          pulled, so the check can go red.)
    #   local RepoDigests   -> the running image carries this exact digest, so
    #                          `docker compose create` builds the container from
    #                          the local layer without contacting the registry.
    # The skip is the pull_policy; the resolve is the local store. Neither alone
    # is sufficient.
    # Why this rather than :latest — :latest fails OPEN. deploy_matrix runs
    # `docker compose pull` on every deploy (scripts/deploy-to.sh), which would
    # move the service to a new image and `up -d` would recreate the bridge on it.
    # Bridges hold Signal/WhatsApp/Telegram session state, so an unplanned jump can
    # de-authenticate a link. This form instead records exactly what is running.
    # TRADEOFF, deliberate: on a fresh host with no local layer this FAILS rather
    # than silently starting a different version. Fail closed. See claude-tasks#3728.
    image: dock.mau.dev/mautrix/telegram@sha256:ddb42d9a943b390bea5a7e365b66b831c6749309e68048fae1e780abcb34aa03
    pull_policy: never
    restart: always
    volumes:
      - telegram_data:/data
    depends_on:
      - continuwuity

  mautrix-discord:
    # PINNED TO A DIGEST THE REGISTRY NO LONGER SERVES — deliberate, and it works.
    # dock.mau.dev has re-published :latest under a new index digest, so this
