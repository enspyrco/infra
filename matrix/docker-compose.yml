    # TRADEOFF, deliberate: on a fresh host with no local layer this FAILS rather
    # than silently starting a different version. Fail closed. See claude-tasks#3728.
    image: dock.mau.dev/mautrix/discord@sha256:7716389dfb11dc7a44c8363348a48e91c1c463ded012f0fb08cdf266fcb20246
    pull_policy: never
    restart: always
    volumes:
      - discord_data:/data
    depends_on:
      - continuwuity

  mautrix-signal:
    # image built 2026-06-16 (was :latest); multi-arch manifest list. NOTE: dock.mau.dev prunes old index
    # digests — three sibling bridges already lost theirs. If this one is collected,
    # `deploy matrix` FAILS on this service (fail-closed, not a silent upgrade);
    # the fix is to mirror it into our own GHCR. claude-tasks#3728.
    image: dock.mau.dev/mautrix/signal@sha256:0adf4fc6ba9d7ae95a0904f8432cde637093948a615612058934a7a484221390
    restart: always
    volumes:
      - signal_data:/data
    depends_on:
      - continuwuity

