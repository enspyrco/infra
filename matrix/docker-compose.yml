  relay-bot:
    build: ./relay
    restart: always
    environment:
      RELAY_HOMESERVER_URL: http://continuwuity:6167
      RELAY_DOMAIN: ${MATRIX_SERVER_NAME}
      RELAY_AS_TOKEN: ${RELAY_AS_TOKEN}
      RELAY_HS_TOKEN: ${RELAY_HS_TOKEN}
      RELAY_PORTAL_ROOMS: ${PORTAL_ROOMS:-}
      RELAY_HUB_ROOM_ID: ${HUB_ROOM_ID}
      RELAY_DB_PATH: /data/relay.db
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-INFO}
      RELAY_DOUBLE_PUPPETS: ${RELAY_DOUBLE_PUPPETS:-}
    volumes:
      - relay_data:/data
    depends_on:
      - continuwuity

  relay-bot-hf:
    build: ./relay
    restart: always
    environment:
      RELAY_HOMESERVER_URL: http://continuwuity:6167
      RELAY_DOMAIN: ${MATRIX_SERVER_NAME}
      RELAY_AS_TOKEN: ${HF_RELAY_AS_TOKEN}
      RELAY_HS_TOKEN: ${HF_RELAY_HS_TOKEN}
      RELAY_PORTAL_ROOMS: ${HF_PORTAL_ROOMS:-}
      RELAY_HUB_ROOM_ID: ${HF_HUB_ROOM_ID}
      RELAY_BOT_LOCALPART: relay-bot-hf
      RELAY_PUPPET_PREFIX: _relayhf_
      RELAY_DB_PATH: /data/relay.db
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-INFO}
      RELAY_DOUBLE_PUPPETS: ""
    volumes:
      - relay_hf_data:/data
    depends_on:
      - continuwuity

  # --- aiko-bridge: Matrix <-> aiko_chat (Aiko Services / MQTT) -------------
  # Source is the matrix/aiko-chat-bridge submodule (github.com/nickmeinhold/aiko-chat-bridge).
  # Config + registration + db live server-side in ./aiko-bridge-data (gitignored),
  # generated/registered once per the bridge README (like the other mautrix bridges).
  aiko-mosquitto:
    # Pinned to the digest THIS STACK IS ACTUALLY RUNNING, not to `:2`.
    # `:2` has already moved under us and this is the live proof, not a worry:
    #   running here          eclipse-mosquitto@sha256:a908c65c…  built 2026-04-15
    #   what `:2` resolves to eclipse-mosquitto@sha256:6f8d8a94…  built 2026-06-22
    # Both are app version 2.1.2 — a base-image rebuild, not a mosquitto upgrade —
    # so the jump is low-stakes. But deploy_matrix runs `docker compose pull`, so on
    # `:2` the next deploy would have silently recreated this container on the June
    # image. That is the exact class this file exists to close.
    # The running image is UNTAGGED locally (no tag points at it), which is why it
    # looked unpinnable; its RepoDigest is still served by Docker Hub as a multi-arch
    # index, so it pins cleanly. Upgrading is now a deliberate edit, not a side effect.
    image: eclipse-mosquitto@sha256:a908c65cc8e67ec9d292ef27c2c0360dbaaee7eb1b935cdd194e67697f15dea1
    restart: always
    volumes:
      - ./aiko-chat-bridge/deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - aiko_mosquitto_data:/mosquitto/data

  aiko-registrar:
    build: ./aiko-chat-bridge
    # Built ON THE BOX by the aiko-registrar service's `build: ./aiko-chat-bridge`;
    # all three services naming this tag consume that locally-built image. There is
    # no registry digest to pin because the image never comes from a registry.
    # `pull_policy: never` below is not cosmetic. An unqualified `aiko-bridge:latest`
    # resolves to docker.io/library/aiko-bridge, so compose tries to pull it on every
    # deploy. deploy_matrix's --ignore-pull-failures damps the 404 — but the failure
    # that flag CANNOT damp is a 200: if that name ever resolves, the pull succeeds
    # and `up -d` would recreate these services on someone else's layers. That is
    # unlikely (library/ is Docker's own official-images namespace, currently 404 and
    # not third-party claimable) so this is defence-in-depth, not an open hole — but
    # it costs one line and it also stops a pointless failed pull each deploy.
    # Moving this to GHCR is claude-tasks#2937 / #3143. Not a missed pin.
    image: aiko-bridge:latest
    # `build`, not `never`: this service HAS a build: key, so it produces the
    # image the other two consume. `never` would forbid obtaining it at all.
    pull_policy: build
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    command: ["aiko_registrar"]
    depends_on:
      - aiko-mosquitto

  aiko-chat:
    image: aiko-bridge:latest
    pull_policy: never
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    # geekscape/aiko_chat bootstraps its HyperSpace (channels/users) before
    # `aiko_chat run`; chat_start.sh does that idempotently from its working dir.
    command: ["bash", "-c", "cd /tmp && exec bash /opt/aiko_chat/src/aiko_chat/chat_start.sh"]
    depends_on:
      - aiko-registrar

  aiko-bridge:
    image: aiko-bridge:latest
    pull_policy: never
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    command: ["python", "-m", "aiko_bridge", "-c", "/data/config.yaml"]
    volumes:
      - ./aiko-bridge-data:/data
    depends_on:
      - aiko-chat
      - aiko-registrar
      - continuwuity

volumes:
  continuwuity_data:
  continuwuity_backups:
  telegram_data:
  discord_data:
  signal_data:
  whatsapp_data:
  relay_data:
  relay_hf_data:
  aiko_mosquitto_data:
