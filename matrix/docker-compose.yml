services:
  continuwuity:
    # v0.5.10-1 (was :latest); multi-arch manifest list
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:81ea00ad377999586e2a2c4d18c485fb6582bb37d7b345081f49e48b8f5d17d9
    restart: always
    ports:
      - "8008:6167"   # Client API
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      # Enables `!admin server backup-database` (RocksDB online checkpoint via
      # hardlinks of SST files). Lives in a separate volume from the live
      # database so the backup script can read it without touching the
      # running RocksDB tree. The nightly /opt/scripts/backup.sh reads from
      # the matrix_continuwuity_backups volume and prunes after tarring.
      CONTINUWUITY_DATABASE_BACKUP_PATH: /var/lib/continuwuity-backups
      CONTINUWUITY_PORT: "6167"
      CONTINUWUITY_ADDRESS: "0.0.0.0"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "true"
      CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      # Media is treated as disposable cache (NOT backed up — it's re-fetchable
      # federated/bridged content). Prune dangling media refs on startup so a
      # media-less DB restore boots clean instead of crashing the integrity check.
      CONTINUWUITY_PRUNE_MISSING_MEDIA: "true"
      CONTINUWUITY_LOG: "info"
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      - continuwuity_backups:/var/lib/continuwuity-backups
    ulimits:
      nofile:
        soft: 1048567
        hard: 1048567

  mautrix-telegram:
    # Mirrored into our own GHCR and pinned by digest — the fix claude-tasks#3728
    # called for. Verified byte-identical to the image that was running: pulled
    # back down by this digest, resulting image ID matched the live container
    # exactly (2026-09-01, with a bogus-tag negative control).
    # This replaces a pin to a dock.mau.dev digest the registry NO LONGER SERVED.
    # That pin was FAIL-UNRECOVERABLE: it worked only while the local layer
    # survived, so a teardown + prune, a disk rebuild, or a `docker load` (which
    # strips RepoDigests) left nothing able to recreate the container. This one is
    # immutable AND restorable, so `pull_policy: never` is no longer needed.
    # The package is PRIVATE, so a fresh host needs `docker login ghcr.io` before
    # its first pull (same as ghcr.io/enspyrco/realm-token-server). Without that
    # login `docker compose pull` fails for this service, deploy_matrix's
    # --ignore-pull-failures swallows it, and `up -d` runs from the local image.
    # Registry-independent backstop: raw tarballs in
    # /home/nick/backups/mautrix-images-20260901/ (note `docker load` restores
    # the bytes but NOT the digest name).
    image: ghcr.io/enspyrco/mautrix-telegram@sha256:0a8e6fddc0864b95bc02b0219ce5a3f18420a10bb6088d4aef9122d7554e2771  # upstream build 2026-06-17
    restart: always
    volumes:
      - telegram_data:/data
    depends_on:
      - continuwuity

  mautrix-discord:
    # Mirrored into our own GHCR and pinned by digest — the fix claude-tasks#3728
    # called for. Verified byte-identical to the image that was running: pulled
    # back down by this digest, resulting image ID matched the live container
    # exactly (2026-09-01, with a bogus-tag negative control).
    # This replaces a pin to a dock.mau.dev digest the registry NO LONGER SERVED.
    # That pin was FAIL-UNRECOVERABLE: it worked only while the local layer
    # survived, so a teardown + prune, a disk rebuild, or a `docker load` (which
    # strips RepoDigests) left nothing able to recreate the container. This one is
    # immutable AND restorable, so `pull_policy: never` is no longer needed.
    # The package is PRIVATE, so a fresh host needs `docker login ghcr.io` before
    # its first pull (same as ghcr.io/enspyrco/realm-token-server). Without that
    # login `docker compose pull` fails for this service, deploy_matrix's
    # --ignore-pull-failures swallows it, and `up -d` runs from the local image.
    # Registry-independent backstop: raw tarballs in
    # /home/nick/backups/mautrix-images-20260901/ (note `docker load` restores
    # the bytes but NOT the digest name).
    image: ghcr.io/enspyrco/mautrix-discord@sha256:9d9f9b5fa9da307bf66a362c8929a7073404440e5564a3c7f889bf2d7ffd25dc  # upstream build 2026-05-12
    restart: always
    volumes:
      - discord_data:/data
    depends_on:
      - continuwuity

  mautrix-signal:
    # Mirrored into our own GHCR and pinned by digest — the fix claude-tasks#3728
    # called for. Verified byte-identical to the image that was running: pulled
    # back down by this digest, resulting image ID matched the live container
    # exactly (2026-09-01, with a bogus-tag negative control).
    # Signal's dock.mau.dev digest WAS still served, unlike its three siblings —
    # but it sat on a registry that had already dropped three of four, so it was
    # one GC pulse from the same position rather than a safer class.
    # The package is PRIVATE, so a fresh host needs `docker login ghcr.io` before
    # its first pull (same as ghcr.io/enspyrco/realm-token-server). Without that
    # login `docker compose pull` fails for this service, deploy_matrix's
    # --ignore-pull-failures swallows it, and `up -d` runs from the local image.
    # Registry-independent backstop: raw tarballs in
    # /home/nick/backups/mautrix-images-20260901/ (note `docker load` restores
    # the bytes but NOT the digest name).
    image: ghcr.io/enspyrco/mautrix-signal@sha256:385668cbd80742fde6f0de51b5eb063e492fdfd8a1d6740143a166a5f2689bf9  # upstream build 2026-06-16
    restart: always
    volumes:
      - signal_data:/data
    depends_on:
      - continuwuity

  mautrix-whatsapp:
    # Mirrored into our own GHCR and pinned by digest — the fix claude-tasks#3728
    # called for. Verified byte-identical to the image that was running: pulled
    # back down by this digest, resulting image ID matched the live container
    # exactly (2026-09-01, with a bogus-tag negative control).
    # This replaces a pin to a dock.mau.dev digest the registry NO LONGER SERVED.
    # That pin was FAIL-UNRECOVERABLE: it worked only while the local layer
    # survived, so a teardown + prune, a disk rebuild, or a `docker load` (which
    # strips RepoDigests) left nothing able to recreate the container. This one is
    # immutable AND restorable, so `pull_policy: never` is no longer needed.
    # The package is PRIVATE, so a fresh host needs `docker login ghcr.io` before
    # its first pull (same as ghcr.io/enspyrco/realm-token-server). Without that
    # login `docker compose pull` fails for this service, deploy_matrix's
    # --ignore-pull-failures swallows it, and `up -d` runs from the local image.
    # Registry-independent backstop: raw tarballs in
    # /home/nick/backups/mautrix-images-20260901/ (note `docker load` restores
    # the bytes but NOT the digest name).
    image: ghcr.io/enspyrco/mautrix-whatsapp@sha256:197f9c345f36337fdf80302a7315ffa72a248f277bd21efd051f8d50f960928e  # upstream build 2026-06-18
    restart: always
    volumes:
      - whatsapp_data:/data
    depends_on:
      - continuwuity

  relay-bot:
    build: ./relay
    restart: always
    environment:
      RELAY_HOMESERVER_URL: http://continuwuity:6167
      RELAY_DOMAIN: ${MATRIX_SERVER_NAME}
      RELAY_AS_TOKEN: ${RELAY_AS_TOKEN}
      RELAY_HS_TOKEN: ${RELAY_HS_TOKEN}
      RELAY_PORTAL_ROOMS: ${PORTAL_ROOMS:-}
      RELAY_HUB_ROOM_ID: ${HUB_ROOM_ID}
      RELAY_DB_PATH: /data/relay.db
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-INFO}
      RELAY_DOUBLE_PUPPETS: ${RELAY_DOUBLE_PUPPETS:-}
    volumes:
      - relay_data:/data
    depends_on:
      - continuwuity

  relay-bot-hf:
    build: ./relay
    restart: always
    environment:
      RELAY_HOMESERVER_URL: http://continuwuity:6167
      RELAY_DOMAIN: ${MATRIX_SERVER_NAME}
      RELAY_AS_TOKEN: ${HF_RELAY_AS_TOKEN}
      RELAY_HS_TOKEN: ${HF_RELAY_HS_TOKEN}
      RELAY_PORTAL_ROOMS: ${HF_PORTAL_ROOMS:-}
      RELAY_HUB_ROOM_ID: ${HF_HUB_ROOM_ID}
      RELAY_BOT_LOCALPART: relay-bot-hf
      RELAY_PUPPET_PREFIX: _relayhf_
      RELAY_DB_PATH: /data/relay.db
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-INFO}
      RELAY_DOUBLE_PUPPETS: ""
    volumes:
      - relay_hf_data:/data
    depends_on:
      - continuwuity

  # --- aiko-bridge: Matrix <-> aiko_chat (Aiko Services / MQTT) -------------
  # Source is the matrix/aiko-chat-bridge submodule (github.com/nickmeinhold/aiko-chat-bridge).
  # Config + registration + db live server-side in ./aiko-bridge-data (gitignored),
  # generated/registered once per the bridge README (like the other mautrix bridges).
  aiko-mosquitto:
    # Deliberately NOT digest-pinned, and filed rather than silent: `:2` is a
    # minor tag and therefore still mutable, so deploy_matrix's pull can move it.
    # Pinning it is part of the tag-vs-digest decision in claude-tasks#3729 (which
    # also covers postgres/redis/caddy) — mosquitto is stateless, so it is the
    # easy half of that decision, but it should be decided with the rest.
    image: eclipse-mosquitto:2
    restart: always
    volumes:
      - ./aiko-chat-bridge/deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - aiko_mosquitto_data:/mosquitto/data

  aiko-registrar:
    build: ./aiko-chat-bridge
    # Mutable by design, OUT OF SCOPE for digest pinning, and the same for ALL
    # THREE services that name aiko-bridge:latest (aiko-chat, aiko-bridge,
    # aiko-registrar) — only aiko-registrar carries the `build:` key; the other two
    # consume the image it produces. There is no registry digest to pin because the
    # image never comes from a registry.
    # Compose DOES still try to pull this tag and fail — that is precisely why
    # deploy_matrix passes --ignore-pull-failures (see the comment at
    # scripts/deploy-to.sh, "aiko-chat and aiko-bridge declare image:
    # aiko-bridge:latest with no build: key"). So the behaviour is known and
    # handled at the deploy layer, not left to chance here.
    # The fix is moving it to GHCR — claude-tasks#2937 / #3143. Not a missed pin.
    image: aiko-bridge:latest
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    command: ["aiko_registrar"]
    depends_on:
      - aiko-mosquitto

  aiko-chat:
    image: aiko-bridge:latest
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    # geekscape/aiko_chat bootstraps its HyperSpace (channels/users) before
    # `aiko_chat run`; chat_start.sh does that idempotently from its working dir.
    command: ["bash", "-c", "cd /tmp && exec bash /opt/aiko_chat/src/aiko_chat/chat_start.sh"]
    depends_on:
      - aiko-registrar

  aiko-bridge:
    image: aiko-bridge:latest
    restart: always
    environment:
      AIKO_MQTT_HOST: aiko-mosquitto
      AIKO_NAMESPACE: aiko
    command: ["python", "-m", "aiko_bridge", "-c", "/data/config.yaml"]
    volumes:
      - ./aiko-bridge-data:/data
    depends_on:
      - aiko-chat
      - aiko-registrar
      - continuwuity

volumes:
  continuwuity_data:
  continuwuity_backups:
  telegram_data:
  discord_data:
  signal_data:
  whatsapp_data:
  relay_data:
  relay_hf_data:
  aiko_mosquitto_data:
