    # The only fix that is both immutable and recoverable is mirroring the running
    # images into our own GHCR and pinning there — claude-tasks#3728, which is
    # therefore a real DR gap and not a tidiness item.
    image: dock.mau.dev/mautrix/discord@sha256:7716389dfb11dc7a44c8363348a48e91c1c463ded012f0fb08cdf266fcb20246
    pull_policy: never
    restart: always
    volumes:
      - discord_data:/data
    depends_on:
      - continuwuity

  mautrix-signal:
    # image built 2026-06-16 (was :latest); multi-arch manifest list. NOTE: dock.mau.dev prunes old index
    # digests — three sibling bridges already lost theirs. Deliberately WITHOUT
    # pull_policy: never, unlike those three: this digest is still served, so the
    # image stays restorable from the registry, and removing that would trade a
    # real capability for symmetry. If it is ever collected, deploy_matrix passes
    # --ignore-pull-failures (scripts/deploy-to.sh), so a DEPLOY on this box
    # survives: the pull failure does not abort the stack and `up -d` keeps using
    # the local image. But that saves the deploy, NOT the rebuild — the moment the
    # local layer is gone, signal joins the three dead siblings and is equally
    # unrecoverable. It is one GC pulse from their position, not a safer class.
    # The durable fix is the same for all four: mirror into our own GHCR,
    # claude-tasks#3728.
    image: dock.mau.dev/mautrix/signal@sha256:0adf4fc6ba9d7ae95a0904f8432cde637093948a615612058934a7a484221390
    restart: always
    volumes:
      - signal_data:/data
    depends_on:
      - continuwuity

