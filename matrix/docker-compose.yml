  mautrix-signal:
    # Our own GHCR mirror of the upstream dock.mau.dev image, pinned by digest.
    # NOTE, and this differs from its three siblings: signal's upstream digest was
    # STILL SERVED. It is mirrored not because it was already lost, but because it sat
    # on a registry that had dropped three of four — one GC pulse from their position.
    # The siblings' pins WERE unserved and fail-unrecoverable; this one was not.
    # Verified against the running container two independent ways: same-daemon image-ID
    # comparison on the box, AND pulled from the registry on a machine with NO local
    # cache where the layer DiffID sets matched exactly. (DiffID equality is a strong
    # content check, not a whole-object identity proof — the image-ID comparison is the
    # identity half. Both were done; a bogus-tag control confirmed the check can fail.)
    # SINGLE-PLATFORM linux/arm64, NOT a multi-arch index — pushed from this aarch64
