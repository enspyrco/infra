services:
  continuwuity:
    # v0.5.10-1 (was :latest); multi-arch manifest list
    image: forgejo.ellis.link/continuwuation/continuwuity@sha256:81ea00ad377999586e2a2c4d18c485fb6582bb37d7b345081f49e48b8f5d17d9
    restart: always
    ports:
      - "8008:6167"   # Client API
    environment:
      CONTINUWUITY_SERVER_NAME: ${MATRIX_SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      # Enables `!admin server backup-database` (RocksDB online checkpoint via
      # hardlinks of SST files). Lives in a separate volume from the live
      # database so the backup script can read it without touching the
      # running RocksDB tree. The nightly /opt/scripts/backup.sh reads from
      # the matrix_continuwuity_backups volume and prunes after tarring.
      CONTINUWUITY_DATABASE_BACKUP_PATH: /var/lib/continuwuity-backups
      CONTINUWUITY_PORT: "6167"
      CONTINUWUITY_ADDRESS: "0.0.0.0"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: "true"
      CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      # Media is treated as disposable cache (NOT backed up — it's re-fetchable
      # federated/bridged content). Prune dangling media refs on startup so a
      # media-less DB restore boots clean instead of crashing the integrity check.
      CONTINUWUITY_PRUNE_MISSING_MEDIA: "true"
      CONTINUWUITY_LOG: "info"
    volumes:
      - continuwuity_data:/var/lib/continuwuity
      - continuwuity_backups:/var/lib/continuwuity-backups
    ulimits:
      nofile:
        soft: 1048567
        hard: 1048567

  mautrix-telegram:
    # Our own GHCR mirror of the upstream dock.mau.dev image, pinned by digest.
    # Replaces a pin to an upstream digest the registry no longer served, which was
    # FAIL-UNRECOVERABLE (it held only while the local layer survived).
    # Verified against the running container two independent ways: same-daemon image-ID
    # comparison on the box, AND pulled from the registry on a machine with NO local
    # cache where the layer DiffID sets matched exactly. (DiffID equality is a strong
    # content check, not a whole-object identity proof — the image-ID comparison is the
    # identity half. Both were done; a bogus-tag control confirmed the check can fail.)
    # SINGLE-PLATFORM linux/arm64, NOT a multi-arch index — pushed from this aarch64
    # box, so it is precise for this host and unusable on x86_64. The upstream images
    # it replaces WERE indexes; that property was deliberately traded, not lost.
    # Package is PRIVATE: a host needs `docker login ghcr.io` before its first pull.
    # Recovery paths, limits, and what `docker load` does NOT restore: matrix/DR-RESTORE.md
    image: ghcr.io/enspyrco/mautrix-telegram@sha256:0a8e6fddc0864b95bc02b0219ce5a3f18420a10bb6088d4aef9122d7554e2771  # upstream build 2026-06-17
    restart: always
    volumes:
      - telegram_data:/data
    depends_on:
      - continuwuity

  mautrix-discord:
    # Our own GHCR mirror of the upstream dock.mau.dev image, pinned by digest.
    # Replaces a pin to an upstream digest the registry no longer served, which was
    # FAIL-UNRECOVERABLE (it held only while the local layer survived).
    # Verified against the running container two independent ways: same-daemon image-ID
    # comparison on the box, AND pulled from the registry on a machine with NO local
    # cache where the layer DiffID sets matched exactly. (DiffID equality is a strong
    # content check, not a whole-object identity proof — the image-ID comparison is the
    # identity half. Both were done; a bogus-tag control confirmed the check can fail.)
    # SINGLE-PLATFORM linux/arm64, NOT a multi-arch index — pushed from this aarch64
    # box, so it is precise for this host and unusable on x86_64. The upstream images
    # it replaces WERE indexes; that property was deliberately traded, not lost.
    # Package is PRIVATE: a host needs `docker login ghcr.io` before its first pull.
    # Recovery paths, limits, and what `docker load` does NOT restore: matrix/DR-RESTORE.md
    image: ghcr.io/enspyrco/mautrix-discord@sha256:9d9f9b5fa9da307bf66a362c8929a7073404440e5564a3c7f889bf2d7ffd25dc  # upstream build 2026-05-12
    restart: always
    volumes:
