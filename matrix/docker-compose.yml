    #                          deploy_matrix passes --ignore-pull-failures, so the
    #                          404 on the dead digest is swallowed and `up -d`
    #                          proceeds on the local image.
    #   pull_policy: never  -> NOT load-bearing for keeping the container alive.
    #                          It stops the doomed pull attempt (Skipped, not 404)
    #                          so the deploy log does not carry a red herring.
    # An earlier version of this comment said "neither alone is sufficient". That
    # overclaimed: the digest pin alone keeps the service running.
