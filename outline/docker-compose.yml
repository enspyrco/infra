# ⚠ THIS FILE IS NOT THE DEPLOY PATH FOR PRODUCTION OUTLINE.
# Prod runs hand-managed tenant stacks the host owns, not this one:
#   ~/apps/imagineering-outline/  (outline.imagineering.cc, container imagineering-outline)
# (~/apps/xdeca-outline/ was the other until xdeca was decommissioned 2026-09-02.)
# `~/apps/outline/` does not exist on the box. Running `deploy-to.sh <ip> outline`
# would stand up an ADDITIONAL, conflicting `img-outline` stack — do not do it blindly.
# The digests below record what prod runs. This file is not the NORMAL deploy
# path: scripts/deploy-to.sh now refuses it unless OUTLINE_DEPLOY_OVERRIDE=1,
# so an override deploy is deliberate and exceptional, not impossible.
# The digests here were taken from the live imagineering tenant. When they were
# recorded (2026-08-31) a second tenant, xdeca, ran the SAME digests — that tenant
# was decommissioned 2026-09-02, so this now records the only one there is.
# Stated without a count deliberately: an earlier version said "BOTH tenant stacks",
# accurate the day it was written and false two days later without anyone editing it.
# Reconciling this file with the live tenant stack is tracked in the backlog
# (claude-tasks#3842) — now a one-tenant job, which xdeca's removal made simpler.
services:
  outline:
    # outline v1.6.1 (was :latest); multi-arch manifest list
    image: docker.getoutline.com/outlinewiki/outline@sha256:a750f764080ce28d4a7393176011c8e2e4170b41689a8f6d91327dadf4904eb6
    container_name: img-outline
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - UTILS_SECRET=${UTILS_SECRET}
      - DATABASE_URL=postgres://outline:${POSTGRES_PASSWORD}@postgres:5432/outline?sslmode=disable
      - PGSSLMODE=disable
      - REDIS_URL=redis://redis:6379
      - URL=${OUTLINE_URL}
      - PORT=3000
      - FILE_STORAGE=s3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_S3_UPLOAD_BUCKET_NAME=outline
      - AWS_S3_UPLOAD_BUCKET_URL=${MINIO_URL}
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_ACL=private
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_SECURE=${SMTP_SECURE}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      - ENABLE_UPDATES=false
      - WEB_CONCURRENCY=1
      - LOG_LEVEL=info
    ports:
      - "3012:3000"
    networks:
      - outline

  postgres:
    image: postgres:15-alpine
    container_name: img-outline-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=outline
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=outline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - outline

  redis:
    image: redis:7-alpine
    container_name: img-outline-redis
    restart: unless-stopped
    networks:
      - outline

  minio:
    # image built 2025-09-07 (was untagged); multi-arch manifest list
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: img-outline-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"
    networks:
      - outline

  # One-time setup to create buckets for all services that use MinIO
  # (Kan.bn buckets are created here because MinIO only runs in the Outline stack)
  minio-setup:
    # (was untagged); multi-arch manifest list
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: img-outline-minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/outline --ignore-existing;
      mc anonymous set download myminio/outline;
      mc mb myminio/kanbn-avatars --ignore-existing;
      mc anonymous set download myminio/kanbn-avatars;
      mc mb myminio/kanbn-attachments --ignore-existing;
      mc anonymous set download myminio/kanbn-attachments;
      exit 0;
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - outline

volumes:
  postgres_data:
  minio_data:

networks:
  outline:
